<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- 1. Default Sans-Serif Fallback Order -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family> <!-- English First -->
      <family>Source Han Sans CN</family> <!-- Force SC/Simplified Chinese -->
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>

  <!-- 2. Default Serif Fallback Order -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family> <!-- English First -->
      <family>Source Han Serif CN</family> <!-- Force SC/Simplified Chinese -->
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>

  <!-- 3. Default Monospace Fallback Order -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family> <!-- English First -->
      <family>Sarasa Term SC</family> <!-- Monospace SC -->
      <family>Source Han Sans CN</family> 
    </prefer>
  </alias>

  <!-- 4. Explicit Language Context Override -->
  <!-- If any app defaults to a generic CJK font, push SC variants first -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans CN</string>
    </edit>
  </match>

</fontconfig>
